# High-performance networking & memory tuning for soft routers and mini PCs
# 1. UDP socket buffer size (prevents kernel socket overflow on Tailscale/WireGuard/QUIC)
net.core.rmem_max=7500000
net.core.wmem_max=7500000
net.core.netdev_max_backlog=10000

# 2. Memory swappiness (never write processes to disk unless physical RAM is below 5%)
vm.swappiness=5

# 3. Network connection pool hardening
net.ipv4.tcp_max_syn_backlog=8192
