name: Sync Third-Party Packages (Manual)

on:
  # 仅支持手动触发 (workflow_dispatch)，平时完全冻结 packages/ 已验证版本，防止上游插件静默更新引入 Bug
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Upstream Plugins to packages/
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull Latest Upstream Plugins (Safe Sync with Delete Protection)
        run: |
          sudo timedatectl set-timezone 'Asia/Shanghai'
          mkdir -p /tmp/upstream_sync

          # 安全同步函数：仅当上游克隆成功且非空时才更新本地 packages/ 目录；若上游删库则自动跳过并保留本地备份
          sync_repo() {
            local repo_url="$1"
            local branch="$2"
            local target_name="$3"
            local tmp_dir="/tmp/upstream_sync/${target_name}"

            echo ">>> Checking upstream: ${repo_url} -> packages/${target_name}"
            rm -rf "$tmp_dir"
            if [ -n "$branch" ]; then
              git clone --depth=1 -b "$branch" "$repo_url" "$tmp_dir" 2>/dev/null || {
                echo "  [Skip] Upstream $repo_url ($branch) unreachable/deleted. Keeping existing packages/${target_name}."
                return 0
              }
            else
              git clone --depth=1 "$repo_url" "$tmp_dir" 2>/dev/null || {
                echo "  [Skip] Upstream $repo_url unreachable/deleted. Keeping existing packages/${target_name}."
                return 0
              }
            fi

            rm -rf "$tmp_dir/.git"
            if [ -n "$(ls -A "$tmp_dir" 2>/dev/null)" ]; then
              rm -rf "packages/${target_name}"
              cp -rf "$tmp_dir" "packages/${target_name}"
              echo "  [OK] Updated packages/${target_name}"
            fi
          }

          # 1. 同步独立第三方插件仓库
          sync_repo "https://github.com/sbwml/luci-app-quickfile.git" "" "quickfile"
          sync_repo "https://github.com/sbwml/luci-app-mosdns.git" "v5" "mosdns"
          sync_repo "https://github.com/sbwml/v2ray-geodata.git" "" "v2ray-geodata"
          sync_repo "https://github.com/nikkinikki-org/OpenWrt-nikki.git" "" "nikki"
          rm -rf packages/nikki/mihomo-alpha
          sync_repo "https://github.com/asvow/luci-app-tailscale.git" "" "luci-app-tailscale"
          sync_repo "https://github.com/adminchenyu/LAN-Scanner.git" "" "luci-app-lan-scanner"

          # 2. 同步 sbwml/openwrt_pkgs 中的指定子包 (OTA / 网速测试 / Socat)
          echo ">>> Checking upstream: https://github.com/sbwml/openwrt_pkgs.git (sparse)"
          if git clone --depth=1 --filter=blob:none --sparse "https://github.com/sbwml/openwrt_pkgs.git" /tmp/upstream_sync/openwrt_pkgs 2>/dev/null; then
            pushd /tmp/upstream_sync/openwrt_pkgs >/dev/null
            git sparse-checkout set luci-app-ota otahelper luci-app-netspeedtest speedtest-cli luci-app-socat
            popd >/dev/null
            for pkg in luci-app-ota otahelper luci-app-netspeedtest speedtest-cli luci-app-socat; do
              if [ -d "/tmp/upstream_sync/openwrt_pkgs/$pkg" ]; then
                rm -rf "packages/$pkg"
                cp -rf "/tmp/upstream_sync/openwrt_pkgs/$pkg" "packages/$pkg"
                echo "  [OK] Updated packages/$pkg"
              fi
            done
          else
            echo "  [Skip] sbwml/openwrt_pkgs unreachable/deleted. Keeping existing local packages."
          fi

      - name: Apply Post-Sync Security & Compatibility Hardening Patches
        run: |
          echo ">>> Running Post-Sync Hardening Hooks..."

          # 1. 自动加固 luci-app-ota: 修复 sbwml alias 语法在非交互 bash 下执行失败的问题，并支持 302 重定向
          if [ -f packages/luci-app-ota/root/usr/bin/ota ]; then
            sed -i '/alias board_name/d' packages/luci-app-ota/root/usr/bin/ota
            if ! grep -q "board_name()" packages/luci-app-ota/root/usr/bin/ota; then
              sed -i '/\[ -z "\$BUILD_DATE" \] && BUILD_DATE=0/a\\n# Override board_name on non-DTS architectures (x86_64 and armsr/armv8)\nif [ "$(uname -m)" = "x86_64" ]; then\n    board_name() { echo "x86_64"; }\nelif [ "$OPENWRT_BOARD" = "armsr/armv8" ]; then\n    board_name() { echo "armsr,armv8"; }\nfi' packages/luci-app-ota/root/usr/bin/ota
            fi
            sed -i 's/curl -I -o \/dev\/null -s -w/curl -L -s -o \/dev\/null -w/g' packages/luci-app-ota/root/usr/bin/ota
            sed -i 's/curl -s "\$API"/curl -L -s "\$API"/g' packages/luci-app-ota/root/usr/bin/ota
            echo "  [OK] Patched luci-app-ota (robust board_name function & curl -L redirect support)"
          fi

          # 2. 自动加固 luci-app-tailscale: 强制 --netfilter-mode=off，禁止脚本动态污染 fw4 防火墙
          if [ -f packages/luci-app-tailscale/root/etc/init.d/tailscale ]; then
            sed -i 's/procd_set_param command \$PROGD$/procd_set_param command \$PROGD --netfilter-mode=off/g' packages/luci-app-tailscale/root/etc/init.d/tailscale
            sed -i '/Remove network settings/,/\/etc\/init\.d\/firewall reload/d' packages/luci-app-tailscale/root/etc/init.d/tailscale
            echo "  [OK] Patched luci-app-tailscale init script (--netfilter-mode=off)"
          fi
          if [ -f packages/luci-app-tailscale/root/usr/sbin/tailscale_helper ]; then
            sed -i '/# Configure network interface for Tailscale/,$d' packages/luci-app-tailscale/root/usr/sbin/tailscale_helper
            printf '[ -n "$(uci changes dhcp)" ] && uci commit dhcp && /etc/init.d/dnsmasq reload\nexit 0\n' >> packages/luci-app-tailscale/root/usr/sbin/tailscale_helper
            echo "  [OK] Patched luci-app-tailscale tailscale_helper (fw4 protection)"
          fi

          # 3. 移除冗余/冲突文件并标准化权限
          rm -rf packages/nikki/mihomo-alpha
          find packages/ -type f -exec sed -i 's/\r$//' {} +
          chmod 0755 packages/fastnet/fastnet/files/* packages/luci-app-lan-scanner/root/usr/libexec/* packages/luci-app-usb-writer/root/usr/libexec/* packages/luci-app-ota/root/usr/bin/* 2>/dev/null || true
          echo ">>> Post-Sync Hardening Complete!"

      - name: Commit & Push Updated Packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/
          if git diff --cached --quiet; then
            echo ">>> No upstream plugin changes detected today."
          else
            update_date=$(date '+%Y-%m-%d %H:%M')
            git commit -m "chore(packages): sync upstream third-party plugins ($update_date)"
            git push origin HEAD:main
            echo ">>> Successfully synced and pushed updated plugins to packages/!"
          fi
